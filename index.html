<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>FitTrack</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#15171B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitTrack" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div id="app"></div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="program"><span class="icon">&#128203;</span>Program</button>
    <button data-tab="progress"><span class="icon">&#128200;</span>Progress</button>
  </nav>

  <!-- Runs before the module script and never fails to load itself, so
       it can surface errors even if js/app.js or one of its imports
       fails entirely (e.g. a missing file after re-uploading an
       update). Without this, a broken import is a silent white
       screen with no way to see why on an iPhone with no console. -->
  <script>
    (function () {
      var box = null;
      function showBootError(msg) {
        if (!box) {
          box = document.createElement("div");
          box.id = "boot-error";
          box.style.cssText =
            "position:fixed;top:0;left:0;right:0;z-index:99999;background:#E0553F;color:#fff;" +
            "padding:12px 14px;font:12px/1.4 -apple-system,monospace;white-space:pre-wrap;" +
            "max-height:45vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,0.4)";
          var title = document.createElement("div");
          title.textContent = "FitTrack failed to load — screenshot this and share it:";
          title.style.cssText = "font-weight:700;margin-bottom:6px";
          box.appendChild(title);
          var pre = document.createElement("div");
          pre.id = "boot-error-body";
          box.appendChild(pre);
          document.body.appendChild(box);
        }
        var body = document.getElementById("boot-error-body");
        body.textContent += (body.textContent ? "\n\n" : "") + msg;
      }
      window.addEventListener("error", function (e) {
        var loc = e.filename ? e.filename.split("/").slice(-2).join("/") + ":" + e.lineno : "";
        showBootError((e.message || "Script error") + (loc ? " (" + loc + ")" : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        showBootError("Unhandled error: " + reason);
      });
      window.__showBootError = showBootError;
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
